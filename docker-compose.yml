version: "3.8"

services:
  aios-telemetry:
    build: .
    container_name: aios-telemetry
    ports:
      - "7860:7860"
    environment:
      - LLM_PROVIDER=docker
      - LLM_MODEL=ai/gemma3
      # Docker Model Runner runs on the host, accessible from the container via:
      - DOCKER_MODEL_RUNNER_URL=http://host.docker.internal:12434/engines/llama.cpp/v1
    volumes:
      # Persist telemetry archives and config between container restarts
      - ./telemetry_archive:/app/telemetry_archive
      - ./config.json:/app/config.json
    extra_hosts:
      # Ensure host.docker.internal resolves on Linux too
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

